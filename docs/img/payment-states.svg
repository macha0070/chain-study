<rect x="26" y="92" width="132" height="46" rx="9" fill="#17352a" stroke="#8794ab" stroke-width="1.3"/>
<text x="92.0" y="112" fill="#8794ab" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">created</text>
<text x="92.0" y="127" fill="#8794ab" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="normal">発行しただけ</text>
<rect x="196" y="92" width="132" height="46" rx="9" fill="#3a2c14" stroke="#f0b64e" stroke-width="1.3"/>
<text x="262.0" y="112" fill="#f0b64e" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">detected</text>
<text x="262.0" y="127" fill="#8794ab" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="normal">mempool で発見</text>
<rect x="366" y="92" width="132" height="46" rx="9" fill="#152a44" stroke="#6aa6ff" stroke-width="1.3"/>
<text x="432.0" y="112" fill="#6aa6ff" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">confirming</text>
<text x="432.0" y="127" fill="#8794ab" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="normal">ブロックに入った</text>
<rect x="536" y="92" width="132" height="46" rx="9" fill="#17352a" stroke="#56d39a" stroke-width="2.4"/>
<text x="602.0" y="112" fill="#56d39a" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">settled</text>
<text x="602.0" y="127" fill="#8794ab" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="normal">必要確認数に到達</text>
<rect x="26" y="196" width="132" height="46" rx="9" fill="#1c2233" stroke="#8794ab" stroke-width="1.3"/>
<text x="92.0" y="216" fill="#8794ab" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">expired</text>
<text x="92.0" y="231" fill="#8794ab" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="normal">期限切れ</text>
<rect x="366" y="196" width="132" height="46" rx="9" fill="#241c3a" stroke="#a98bff" stroke-width="1.3"/>
<text x="432.0" y="216" fill="#a98bff" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">underpaid</text>
<text x="432.0" y="231" fill="#8794ab" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="normal">金額が足りない</text>
<rect x="536" y="196" width="132" height="46" rx="9" fill="#2b1a1f" stroke="#ff6b6b" stroke-width="2.4"/>
<text x="602.0" y="216" fill="#ff6b6b" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-weight="600">reversed</text>
<text x="602.0" y="231" fill="#8794ab" font-size="10" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="normal">リオーグで消えた</text>
<text x="262.0" y="80" fill="#f0b64e" font-size="10.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="normal">0 確認 — 渡してはいけない</text>
<text x="602.0" y="80" fill="#56d39a" font-size="10.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">ここで渡す</text>
<text x="682" y="216" fill="#ff6b6b" font-size="10.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-weight="normal">この方式に固有の状態。</text>
<text x="682" y="231" fill="#8794ab" font-size="10.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-weight="normal">誰の意思でもなく起きるので、</text>
<text x="682" y="245" fill="#8794ab" font-size="10.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-weight="normal">事後に取り返す手段がない。</text>
<line x1="26" y1="268" x2="852" y2="268" stroke="#2a3550"/>
<text x="26" y="286" fill="#8794ab" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="start" font-weight="normal">確認が積まれるほど期待損失（= 覆される確率 × 金額）が下がる。どこで止めるかを決めるのが決済システムの仕事</text>
</svg>
